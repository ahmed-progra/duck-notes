<!doctype html>
<html lang="en">

<title>Duck Notes launch artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{color:#2C2C2E;background:#FAF9F6;font-family:'Segoe UI',Arial,sans-serif}.art{position:relative;width:1600px;height:900px;background:url('../media/launch-background.png') center/cover}.brand{position:absolute;left:76px;top:68px;display:flex;align-items:center;gap:20px;font-size:32px;font-weight:600;letter-spacing:-1px}.icon{display:grid;place-items:center;width:76px;height:76px;background:#D7494C;border-radius:22px}.icon img{width:66px;filter:brightness(0) invert(1)}.edition{position:absolute;right:76px;top:92px;font-size:17px;letter-spacing:2px;color:#66666C}.headline{position:absolute;left:76px;top:218px;margin:0;font:normal 82px/1.06 Georgia,'Times New Roman',serif;letter-spacing:-3px}.headline em{color:#D7494C;font-weight:normal}.features{position:absolute;left:80px;top:595px;font-size:23px;letter-spacing:.2px}.description{position:absolute;left:80px;top:651px;font-size:22px;line-height:1.55;color:#69696F;max-width:460px}.screen{position:absolute;left:650px;top:205px;width:874px;border:1px solid #DDDAD5;border-radius:14px;overflow:hidden;background:white;box-shadow:0 28px 65px #38221C19}.screen img{display:block;width:100%;height:auto}.footer{position:absolute;left:80px;bottom:63px;right:76px;display:flex;justify-content:space-between;border-top:1px solid #DAD7D1;padding-top:24px;color:#67676D;font-size:17px;letter-spacing:.4px}.footer strong{font-weight:500;color:#2C2C2E}.portrait .art{width:1200px;height:1500px}.portrait .brand{left:64px;top:65px}.portrait .edition{right:64px;top:91px}.portrait .headline{left:64px;top:209px;font-size:111px;line-height:1.02;letter-spacing:-4px}.portrait .features{left:69px;top:582px;font-size:28px}.portrait .description{left:69px;top:632px;font-size:25px;max-width:1000px}.portrait .screen{left:64px;top:700px;width:1072px}.portrait .wide{display:none}.portrait .footer{left:68px;right:64px;bottom:47px;font-size:19px;padding-top:22px}
</style>
<body>
<main class="art">
  <div class="brand"><span class="icon"><img src="../media/duck-mark.svg" alt="Duck mark"></span>Duck Notes</div>
  <div class="edition">ANDROID · 0.1.1</div>
  <h1 class="headline">Your notes.<br>Connected.<br><em>Offline.</em></h1>

  <div class="description">A local workspace for writing,<br class="wide"> organizing, and connecting ideas.</div>
  <div class="screen"><img src="../media/duck-notes-editor.png" alt="Actual Duck Notes Android interface displaying a synthetic research journal"></div>
  <div class="footer"><strong>Open source. Thoughtfully connected.</strong><span>MIT License · Android 8.0+</span></div>
</main>
<script>if(new URLSearchParams(location.search).get('format')==='linkedin')document.body.classList.add('portrait');</script>
